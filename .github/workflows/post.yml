name: Karusel Paylas

on:
  schedule:
    # Her yarım saatte uyanır; gate.py paylaşım zamanı gelmişse devam eder (GitHub zamanlayıcısı geç/eksik çalışabildiği için)
    - cron: "7,37 * * * *"
  repository_dispatch:
    types: [zamanla]  # dış saat (bilgisayardan bağımsız) her 15 dk'da bunu tetikler; gate.py zamanı karar verir
  workflow_dispatch:
    inputs:
      deneme:
        description: "Sadece üret, Instagram'da paylaşma"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: paylas
  cancel-in-progress: false

jobs:
  paylas:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Paylaşım zamanı geldi mi?
        id: kapi
        run: python3 gate.py

      - uses: actions/setup-python@v5
        if: steps.kapi.outputs.devam == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - if: steps.kapi.outputs.devam == 'true'
        run: pip install -r requirements.txt && playwright install --with-deps chromium

      - name: Metin üret
        if: steps.kapi.outputs.devam == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate.py

      - name: Görselleri üret
        if: steps.kapi.outputs.devam == 'true'
        run: python render.py

      - name: Görselleri herkese açık dala yükle
        if: steps.kapi.outputs.devam == 'true'
        run: |
          mkdir /tmp/yayin && cp out/*.jpg /tmp/yayin && cd /tmp/yayin
          git init -q -b gecici
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm gorseller
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gecici

      - name: Instagram'da paylaş
        if: ${{ steps.kapi.outputs.devam == 'true' && !inputs.deneme }}
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMG_BASE: https://raw.githubusercontent.com/${{ github.repository }}/gecici
        run: python publish.py

      - name: Geçmişi kaydet
        if: ${{ steps.kapi.outputs.devam == 'true' && !inputs.deneme }}
        run: |
          git config user.name bot && git config user.email bot@users.noreply.github.com
          git add gecmis.json konular.json
          git diff --cached --quiet || { git commit -qm "gecmis guncellendi" && git pull -q --rebase && git push -q; }
